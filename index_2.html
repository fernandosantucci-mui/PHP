<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Balança-Mas-Não-Cai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Fonte mais moderna e legível */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212; 
            color: #f1f1f1; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e; 
            width: 100%;
            /* Espaçamento interno aumentado para mais "respiro" */
            padding: 50px; 
            border-radius: 12px;
            /* Sombra mais profunda para destacar o painel do fundo */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 55, 0.1); 
            border-top: 5px solid #d4af37; 
        }

        h1, h2 {
            color: #d4af37; 
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px; /* Letras ligeiramente mais espaçadas */
            text-align: center;
            border-bottom: 1px solid #333333; 
            padding-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px; /* Mais espaço entre os campos */
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #d4af37; 
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            /* Campos ligeiramente mais altos */
            padding: 14px 16px; 
            background-color: #2a2a2a; 
            color: #ffffff;
            border: 1px solid #444444;
            border-radius: 8px; /* Cantos um pouco mais arredondados */
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #d4af37;
            background-color: #333333; /* Fundo clareia levemente ao clicar */
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            color: #d4af37; 
            background-color: #333333; 
            border: 1px solid #d4af37; 
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn:hover { 
            background-color: #444444; 
            transform: translateY(-2px); /* Efeito de flutuação no botão */
        }

        .btn-red { 
            background-color: #b30000; 
            color: #ffffff;
            border: none;
        }

        .btn-red:hover { 
            background-color: #e60000; 
            box-shadow: 0 4px 12px rgba(230, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 400px;">
        <h2> Pinel de acesso </h2>
        <form method="post" action="autenticacao.php">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="usuario@gmail.com" required autofocus>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="senha" placeholder="......" required>
            </div>
            <button type="submit" class="btn btn-red" style="width: 100%;">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
